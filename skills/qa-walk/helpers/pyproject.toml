[project]
name = "qa-walk-helpers"
version = "0.1.0"
description = "Helper scripts for the qa-walk skill"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.9",
    "pyyaml>=6.0.2",
    "jinja2>=3.1",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-snapshot>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
